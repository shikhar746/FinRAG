# Shared settings. Each config file sets `base: base.yaml` and overrides keys.
seed: 13
paths:
  data: data
  results: results
  splits: splits.json
  cache: data/cache

retrieval:
  top_k: 100              # ranking depth kept per question (so MRR is MRR@100)
  ks: [1, 5, 10]
  scopes: [document, corpus]   # document = search inside the question's filing; corpus = all 84 filings

bm25: {k1: 1.5, b: 0.75}  # rank_bm25 defaults; not tuned

dense:
  model_dir: data/models/all-MiniLM-L6-v2
  max_tokens: 256         # all-MiniLM-L6-v2's sentence-transformers max_seq_length
  window_stride: 32       # overlap between windows in max_window mode
  batch_size: 64

# ---- generation ----
llm:
  backend: ollama         # chosen by the project owner (free, local)
  model: qwen2.5:7b       # see DECISIONS.md D13
  temperature: 0.0
  max_tokens: 512
  ollama: {host: "http://localhost:11434", num_ctx: 16384}
  anthropic: {max_usd: null, usd_per_mtok_in: null, usd_per_mtok_out: null}  # unused; set a cap before ever switching

answers:
  questions: dev          # MVP generation runs on the 50 dev questions only; test stays untouched
  rag_k: 5                # pages given to the model in RAG configs
  numeric_rel_tol: 0.01   # within 1% ...
  gold_rounding_tol: true # ... or within rounding of the gold's last shown digit (DECISIONS.md D15)
  allow_scale: false      # strict on units; unit slips are reported in a separate column
